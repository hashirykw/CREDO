<!doctype html>
<html lang="en" data-skin="senior" data-theme="mist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credo Portal · Students, Parents & Teachers</title>
<meta name="description" content="The Credo Portal for the Credo School & College Network, Karachi: daily diary, timetable, homework, notes, results, attendance and emergency notes for students, parents and teachers.">
<meta name="theme-color" content="#d9e0f5">
<link rel="canonical" href="https://credo.nexlyr.solutions/">
<meta property="og:type" content="website">
<meta property="og:title" content="Credo Portal · Students, Parents & Teachers">
<meta property="og:description" content="Diary, timetable, homework, results and attendance for every Credo family — connected, live.">
<meta property="og:image" content="https://credo.nexlyr.solutions/assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/portal.css">
<script>
  /* paint the saved look before anything renders */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    try {
      var s = JSON.parse(localStorage.getItem('credo:look') || '{}');
      d.dataset.skin = s.skin || 'senior';
      d.dataset.theme = (d.dataset.skin === 'junior' ? s.junior : s.senior) || (d.dataset.skin === 'junior' ? 'night' : 'mist');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><span class="grain"></span></div>
<div id="root"><noscript><p style="padding:2rem;font-family:sans-serif">The Credo Portal needs JavaScript turned on.</p></noscript></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/portal-config.js"></script>
<script src="assets/js/portal.js"></script>
</body>
</html>
